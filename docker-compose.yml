services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wox_barbershop_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - wox_network
    depends_on:
      - db

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: wox_barbershop_nginx
    restart: unless-stopped
    ports:
      - "30000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wox_network
    depends_on:
      - app

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: wox_barbershop_mysql
    restart: unless-stopped
    ports:
      - "30002:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wox_barbershop}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-wox_user}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wox_network

  # PHPMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wox_barbershop_phpmyadmin
    restart: unless-stopped
    ports:
      - "30001:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
      UPLOAD_LIMIT: 300M
    networks:
      - wox_network
    depends_on:
      - db

# Docker Networks
networks:
  wox_network:
    driver: bridge

# Docker Volumes
volumes:
  mysql_data:
    driver: local
